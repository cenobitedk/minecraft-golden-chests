plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17.487" apply false
    id "dev.architectury.loom-no-remap" version "1.17.487" apply false
    id "com.diffplug.spotless" version "8.10.3" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

configure(subprojects) {
    def noRemap = project.name == "neoforge"

    if (noRemap) {
        apply plugin: "dev.architectury.loom-no-remap"
    } else {
        apply plugin: "dev.architectury.loom"
        dependencies {
            mappings files("${rootProject.projectDir}/libs/identity-mappings-26.2.jar")
        }
    }
    apply plugin: "architectury-plugin"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        testImplementation platform("org.junit:junit-bom:6.1.3")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.named("test") {
        useJUnitPlatform()
        systemProperty "golden_chests.root_dir", rootProject.projectDir.absolutePath
        systemProperty "golden_chests.resources_dir", sourceSets.main.output.resourcesDir.absolutePath
        ["mod_version", "minecraft_version", "java_version", "fabric_loader_version"].each {
            systemProperty "golden_chests.${it}", rootProject.property(it)
        }
        testLogging {
            events "failed", "skipped"
            exceptionFormat = "full"
        }
    }

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"
    apply plugin: "com.diffplug.spotless"

    spotless {
        java {
            target "src/*/java/**/*.java"
            palantirJavaFormat("2.99.0")
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
        groovyGradle {
            target "*.gradle"
            leadingTabsToSpaces(4)
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    repositories {
        mavenCentral()
    }
}

def distDir = layout.projectDirectory.dir("dist")

// Version-line branches (26.2, 26.3, …) keep a stable jar name.
// Feature / PR / detached builds append the short commit SHA to the file name only
// (mod metadata still uses mod_version from gradle.properties).
def isVersionLineBranch = { String name -> name ==~ /^\d+\.\d+(\.\d+)?$/ }

def runGit = { String... args ->
    def pb = new ProcessBuilder(["git", *args])
    pb.directory(rootProject.projectDir)
    pb.redirectErrorStream(true)
    def proc = pb.start()
    def out = proc.inputStream.text.trim()
    proc.waitFor() == 0 ? out : ""
}

def resolveRefName = {
    def fromEnv = System.getenv("GITHUB_REF_NAME")
    if (fromEnv) {
        return fromEnv
    }
    def branch = runGit("rev-parse", "--abbrev-ref", "HEAD")
    return branch ?: "HEAD"
}

def resolveShortSha = {
    def fromEnv = System.getenv("GITHUB_SHA")
    if (fromEnv) {
        return fromEnv.substring(0, Math.min(7, fromEnv.length()))
    }
    def sha = runGit("rev-parse", "--short", "HEAD")
    return sha ?: "unknown"
}

ext.jar_mod_version = isVersionLineBranch(resolveRefName())
        ? mod_version.toString()
        : "${mod_version}-${resolveShortSha()}"

configure(subprojects.findAll { it.name in ["fabric", "neoforge"] }) {
    // golden-chests-<mc>-<loader>-<mod version>[-<sha>].jar
    base {
        archivesName = "${rootProject.archives_base_name}-${rootProject.minecraft_version}-${project.name}"
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = rootProject.jar_mod_version
    }

    // Fabric's distributable jar is produced by remapJar; NeoForge (no-remap) ships the plain jar.
    def releaseJar = tasks.names.contains("remapJar") ? tasks.named("remapJar") : tasks.named("jar")

    def copyToDist = tasks.register("copyJarToDist", Copy) {
        group = "build"
        description = "Copies the release jar into the root dist/ folder."
        from releaseJar
        into distDir
    }

    tasks.named("build") {
        finalizedBy copyToDist
    }
}

tasks.named("clean") {
    delete distDir
}
