architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {}

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

configurations {
    // Dev runs load common from its source set via loom.mods; a second copy on the runtime classpath
    // would split the mod's packages across two modules.
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileOnly.extendsFrom common
    testImplementation.extendsFrom common

    // FML loads jar-in-jar libraries outside the mod's module, so common must be merged into the mod jar itself.
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    bundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

version = "${rootProject.minecraft_version}-${project.name}-${rootProject.mod_version}"

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": modVersion
    }
}

tasks.jar {
    dependsOn configurations.bundle
    from({ configurations.bundle.collect { zipTree(it) } }) {
        exclude "META-INF/MANIFEST.MF"
    }
    manifest {
        attributes "Specification-Title": "golden_chests"
        attributes "Specification-Vendor": "Jeppe Hasseriis"
        attributes "Specification-Version": project.jar.archiveVersion
        attributes "Implementation-Title": project.name
        attributes "Implementation-Version": project.jar.archiveVersion
        attributes "Implementation-Vendor": "Jeppe Hasseriis"
        attributes "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    }
}
